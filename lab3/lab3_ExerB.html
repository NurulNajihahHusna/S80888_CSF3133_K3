<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ticket Booking</title>
</head>
<body>

    <!-- 
    ==================================================================
    IDENTIFIED ERRORS (PART 1):
    - Error 1 (Line 1): Invalid DOCTYPE. Correct is <!DOCTYPE html>.
    - Error 2 (Line 9): Improper nesting of <span> and <h1>. Changed <h1>...<span>...</h1></span> to <h1>...<span>...</span></h1>.
    - Error 3 (Line 11 & 36): Invalid use of <span>. Changed <span id="content"> to <div id="content">.
    - Error 4 (Line 13): Unescaped '&' symbol. Changed & staff to &amp; staff.
    - Error 5 (Line 14): JavaScript string concatenation causing "2" + "3" = "23". Used parseInt() in oninput attribute.
    - Error 6 (Line 18): Typo in input type="emial". Corrected to type="email".
    - Error 7 (Line 22 & 23): Mismatched datalist ID. Changed id="movielist" to id="movies" to match list="movies".
    - Error 8 (Line 32): Invalid range attributes (min="5" max="1"). Changed to min="1" max="5".
    - Error 9 (Line 33): Output 'for' attribute listed non-existent ID 'kid'. Changed for="adult kid" to for="adult child".
    - Error 10 (Line 38): Entity case error (&Copy;). Changed to lower-case &copy;.
    ==================================================================
    -->

    <div id="header">
        <h1>e-Ticket <span>Your Campus Cinema</span></h1>
    </div>

    <div id="content">
        <h2>Book Your Ticket</h2>
        <p>Promotion: tickets &lt; RM10 for students &amp; staff!</p>
        
        <form action="booking.php" method="post" oninput="total.value = (parseInt(adult.value) || 0) + (parseInt(child.value) || 0)">
            
            <label for="name">Name: </label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus><br>
            
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required><br>
            
            <label for="date">Show date: </label>
            <input type="date" id="date" name="date"><br>
            
            <label for="movie">Movie:</label>
            <input id="movie" name="movie" list="movies"><br>
            <datalist id="movies">
                <option value="Space Rangers">
                <option value="Kampung Comedy">
            </datalist>
            
            <label for="adult">Adult tickets:</label>
            <input type="number" id="adult" name="adult" min="0" value="0"><br>
            
            <label for="child">Child tickets:</label>
            <input type="number" id="child" name="child" min="0" value="0"><br>
            
            <label for="rating">Rate our service: </label>
            <input type="range" id="rating" name="rating" min="1" max="5" value="3"><br>
            
            Total tickets: <output name="total" for="adult child">0</output><br>
            <input type="submit" value="Book Now">
        </form>
    </div>

    <div id="footer">
        <p>&copy; 2026 CineKampus. All rights reserved.</p>
    </div>

</body>
</html>
